name: Build patched ProComic APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply_reader_hotfix.py"
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WYROS repository
        uses: actions/checkout@v4

      - name: Checkout upstream ProComic source
        uses: actions/checkout@v4
        with:
          repository: LoneVertex/mihon-extension-ar-procomic
          path: upstream
          ref: main
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"

      - name: Apply Reader hotfix
        run: |
          python3 scripts/apply_reader_hotfix.py "$GITHUB_WORKSPACE/upstream"

      - name: Bump patched extension version
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("versionCode = 7", "versionCode = 9", 1)
          s = s.replace('versionName = "1.5.1"', 'versionName = "1.5.3"', 1)
          p.write_text(s)
          PY
          grep -n -E 'versionCode|versionName' app/build.gradle.kts

      - name: Install test dependencies
        working-directory: upstream
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Validate Reader hotfix
        run: |
          python3 scripts/test_reader_hotfix.py
          python3 -m py_compile scripts/apply_reader_hotfix.py

      - name: Validate patched source
        working-directory: upstream
        run: |
          git diff --check
          grep -q 'val publicImages = try {' app/src/main/kotlin/eu/kanade/tachiyomi/extension/ar/procomic/ProComic.kt
          grep -q 'hasReaderDeferredOrProtectedContract' app/src/main/kotlin/eu/kanade/tachiyomi/extension/ar/procomic/ProComic.kt
          grep -q 'extractJsonArrayAfterKey(body, "images")' app/src/main/kotlin/eu/kanade/tachiyomi/extension/ar/procomic/ProComicUtils.kt
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "1.5.3"' app/build.gradle.kts

      - name: Build release APK
        id: build_apk
        working-directory: upstream
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > /tmp/procomic-gradle-build.log 2>&1
          status=$?
          mkdir -p dist
          cp /tmp/procomic-gradle-build.log dist/procomic-gradle-build.log
          tail -n 120 /tmp/procomic-gradle-build.log
          exit $status

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: procomic-build-diagnostic
          path: upstream/dist/procomic-gradle-build.log
          if-no-files-found: ignore

      - name: Sign patched APK with a generated key
        if: steps.build_apk.outcome == 'success'
        working-directory: upstream
        env:
          KEYSTORE_PASSWORD: "wyros-procomic-2026"
        run: |
          set -euo pipefail
          sdk_build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          keytool -genkeypair             -keystore /tmp/wyros-procomic-1.5.2.jks             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEYSTORE_PASSWORD"             -alias procomic             -keyalg RSA             -keysize 4096             -validity 3650             -dname "CN=WYROS ProComic, OU=WYROS, O=ProComic"
          mkdir -p dist
          "$sdk_build_tools/apksigner" sign             --ks /tmp/wyros-procomic-1.5.2.jks             --ks-pass pass:"$KEYSTORE_PASSWORD"             --ks-key-alias procomic             --key-pass pass:"$KEYSTORE_PASSWORD"             --out dist/ProComic-v1.5.3-WYROS-signed.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          "$sdk_build_tools/apksigner" verify --verbose --print-certs dist/ProComic-v1.5.2-WYROS-signed.apk
          sha256sum dist/ProComic-v1.5.2-WYROS-signed.apk > dist/ProComic-v1.5.2-WYROS-signed.apk.sha256
          "$sdk_build_tools/aapt2" dump badging dist/ProComic-v1.5.2-WYROS-signed.apk | head -n 2

      - name: Upload patched APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ProComic-v1.5.2-WYROS
          path: |
            upstream/dist/ProComic-v1.5.2-WYROS-signed.apk
            upstream/dist/ProComic-v1.5.2-WYROS-signed.apk.sha256
          if-no-files-found: error
