name: Validate Reader hotfix

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_reader_hotfix.py"
      - "scripts/test_reader_hotfix.py"
      - "docs/READER_HOTFIX.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate hotfix implementation
        run: python3 scripts/test_reader_hotfix.py
