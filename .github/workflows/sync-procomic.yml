name: Sync ProComic release

concurrency:
  group: procomic-sync
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-procomic.yml"
      - "scripts/build_repo.py"
      - "README.md"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve latest upstream release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/LoneVertex/mihon-extension-ar-procomic/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"$release_json")"
          asset_name="$(jq -r '.assets[] | select(.name | endswith(".apk")) | .name' <<<"$release_json" | head -n1)"
          asset_url="$(jq -r --arg n "$asset_name" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$release_json")"
          digest="$(jq -r --arg n "$asset_name" '.assets[] | select(.name == $n) | .digest' <<<"$release_json" | sed 's/^sha256://')"
          test -n "$tag" -a "$tag" != "null"
          test -n "$asset_name" -a "$asset_name" != "null"
          test -n "$asset_url" -a "$asset_url" != "null"
          test -n "$digest" -a "$digest" != "null"
          {
            echo "UPSTREAM_TAG=$tag"
            echo "UPSTREAM_ASSET_NAME=$asset_name"
            echo "UPSTREAM_ASSET_URL=$asset_url"
            echo "UPSTREAM_DIGEST=$digest"
          } >> "$GITHUB_ENV"

      - name: Download and verify upstream APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk icon
          curl -fL --retry 3 --retry-all-errors -o "apk/$UPSTREAM_ASSET_NAME" "$UPSTREAM_ASSET_URL"
          printf '%s  %s\n' "$UPSTREAM_DIGEST" "apk/$UPSTREAM_ASSET_NAME" | sha256sum -c -
          test "$(stat -c%s "apk/$UPSTREAM_ASSET_NAME")" -gt 100000

      - name: Verify package, version and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="apk/$UPSTREAM_ASSET_NAME"
          sdk_build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          badging="$($sdk_build_tools/aapt2 dump badging "$apk")"
          pkg="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          test "$pkg" = "eu.kanade.tachiyomi.extension.ar.procomic"
          test -n "$version_code" -a -n "$version_name"
          cert="$("$sdk_build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -n1 | tr -d ':')"
          test "${#cert}" -eq 64
          old=""
          old_code=0
          if [[ -f repo.json ]]; then
            old="$(jq -r '.meta.signingKeyFingerprint // empty' repo.json)"
          fi
          if [[ -f publication.json ]]; then
            old_code="$(jq -r '.versionCode // 0' publication.json)"
          fi
          # A maintained WYROS hotfix may intentionally remain newer than upstream. In that
          # case, keep the hotfix signing identity and do not block the build merely because
          # upstream uses its original certificate.
          if [[ -n "$old" && "$old" != "$cert" && "$version_code" -ge "$old_code" ]]; then
            echo "Upstream signing certificate changed for a non-hotfix publication; blocking." >&2
            exit 1
          fi
          {
            echo "UPSTREAM_VERSION_CODE=$version_code"
            echo "UPSTREAM_VERSION_NAME=$version_name"
            echo "UPSTREAM_FINGERPRINT=$cert"
            echo "UPSTREAM_SHA256=$(sha256sum "$apk" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Generate indexes and publication metadata
        run: |
          python scripts/build_repo.py --version-code "$UPSTREAM_VERSION_CODE" --version-name "$UPSTREAM_VERSION_NAME" --apk-name "$UPSTREAM_ASSET_NAME" --fingerprint "$UPSTREAM_FINGERPRINT"

      - name: Extract official extension icon
        shell: bash
        run: |
          set -euo pipefail
          apk="apk/$UPSTREAM_ASSET_NAME"
          sdk_build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          badging="$($sdk_build_tools/aapt2 dump badging "$apk")"
          icon_path="$(sed -n "s/.*application-icon-320:'\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
          if [[ -z "$icon_path" ]]; then
            icon_path="$(sed -n "s/.*application-icon-160:'\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
          fi
          test -n "$icon_path"
          python - "$apk" "$icon_path" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          icon_path = sys.argv[2]
          out = Path("icon/eu.kanade.tachiyomi.extension.ar.procomic.png")
          with zipfile.ZipFile(apk) as z:
              try:
                  data = z.read(icon_path)
              except KeyError:
                  candidates = [
                      n for n in z.namelist()
                      if n.lower().endswith(".png")
                      and "/mipmap" in n
                      and "ic_launcher" in n
                  ]
                  if not candidates:
                      raise SystemExit(f"icon resource not found: {icon_path}")
                  data = z.read(sorted(candidates)[-1])
          if len(data) < 100:
              raise SystemExit("extracted icon is unexpectedly small")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print(f"extracted {icon_path} -> {out} ({len(data)} bytes)")
          PY

      - name: Publish repository changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit the generated publication as a local commit first. This makes the
          # generated files rebaseable if another trusted writer advanced main after checkout.
          git add apk icon index.pb index.json index.min.json repo.json publication.json
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi

          git commit -m "sync: ProComic $UPSTREAM_VERSION_NAME [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to publish after $attempt attempts." >&2
              exit 1
            fi
          done