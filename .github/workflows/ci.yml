name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: procomic-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/LoneVertex/mihon-extension-ar-procomic.git
  UPSTREAM_TAG: v1.5.1

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WYROS repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate patcher syntax
        run: python3 -m py_compile scripts/apply_authenticated_reader.py scripts/test_authenticated_reader_patch.py

      - name: Clone pinned upstream
        run: git clone --depth 1 --branch "${{ env.UPSTREAM_TAG }}" "${{ env.UPSTREAM_REPO }}" upstream

      - name: Apply production Reader patch
        run: python3 scripts/apply_authenticated_reader.py upstream

      - name: Run authenticated Reader contract tests
        run: python3 scripts/test_authenticated_reader_patch.py --upstream upstream

      - name: Compile and package unsigned release
        working-directory: upstream
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify generated extension identity
        working-directory: upstream
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          BADGING="$("$AAPT2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='eu.kanade.tachiyomi.extension.ar.procomic'"
          echo "$BADGING" | grep -q "versionCode='7'"
          echo "$BADGING" | grep -q "versionName='1.5.1'"
